<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Inscrição Jovem Aprendiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Portal de Inscrição</h1>
        <p>Preencha os dados abaixo para prosseguir.</p>
    </header>

    <main>
        <section class="form-container">
            <h2>Dados do Candidato</h2>
            
            <div id="feedback-message" class="message" aria-live="polite" role="status"></div>

            <form id="registration-form" novalidate>
                
                <div class="form-group">
                    <label覆 for="name">Nome Completo:</label>
                    <input 
                        type="text" 
                        id="name" 
                        name="name" 
                        placeholder="Digite seu nome" 
                        aria-required="true"
                        aria-describedby="name-error"
                    >
                    <span id="name-error" class="error-text" role="alert"></span>
                </div>

                <div class="form-group">
                    <label for="age">Idade:</label>
                    <input 
                        type="number" 
                        id="age" 
                        name="age" 
                        placeholder="Ex: 16" 
                        aria-required="true"
                        aria-describedby="age-error"
                    >
                    <span id="age-error" class="error-text" role="alert"></span>
                </div>

                <button type="submit">Enviar Inscrição</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Empresa Semântica Ltda. Todos os direitos reservados.</p>
    </footer>

    <script href="script.js"></script>
</body>
</html>
